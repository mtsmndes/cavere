{% extends "base.html" %}
{% block content %}
<div style="max-width:560px; margin:0 auto;">

    <div class="cv-breadcrumb">
        <a href="/"><i data-lucide="layout-dashboard" class="me-1"></i>Painel Principal</a>
        <span class="sep">/</span>
        <span class="current">Novo Equipamento</span>
    </div>

    <div class="surface-card">
        <div class="surface-card-header">
            <div>
                <div style="font-size:1rem; font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.04em; color:var(--text-primary);">
                    Cadastrar Novo Equipamento
                </div>
                <div style="font-size:0.8125rem; color:var(--text-muted); margin-top:2px;">
                    Adicionar novo ativo físico ao inventário operacional da base
                </div>
            </div>
        </div>

        <div class="surface-card-body">
            <form action="/salvar-equipamento" method="POST" id="formEquipamento">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div style="margin-bottom:var(--space-4);">
                    <label class="form-label" for="tipo">Tipo de Equipamento <span style="color:var(--status-danger-text);">*</span></label>
                    <select class="form-select" name="tipo" id="tipo" required onchange="verificarTipo()">
                        <option value="" disabled selected>Selecione o tipo de equipamento...</option>
                        <option value="Celular">Celular</option>
                        <option value="Câmera">Câmera</option>
                        <option value="Notebook">Notebook</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Teclado">Teclado</option>
                        <option value="Mouse">Mouse</option>
                        <option value="Headset">Headset</option>
                        <option value="Tablet">Tablet</option>
                        <option value="Rádio Comunicador">Rádio Comunicador</option>
                        <option value="Detector de Gás">Detector de Gás</option>
                        <option value="Nobreak / Estabilizador">Nobreak / Estabilizador</option>
                        <option value="Periféricos / Acessórios">Periféricos / Acessórios</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div style="margin-bottom:var(--space-4);">
                    <label class="form-label" for="modelo">Modelo do Equipamento <span style="color:var(--status-danger-text);">*</span></label>
                    <input type="text" class="form-control" name="modelo" id="modelo"
                        placeholder="Ex: Samsung Galaxy A54, Kodak Pixpro FZ55, Dell Latitude, etc." required>
                </div>

                <div style="margin-bottom:var(--space-4);">
                    <label class="form-label" for="patrimonio">Número de Patrimônio / Serial (SN) <span style="color:var(--status-danger-text);">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i data-lucide="barcode"></i></span>
                        <input type="text" class="form-control" name="patrimonio" id="patrimonio"
                            placeholder="Ex: SN12345678" required>
                    </div>
                </div>

                <!-- Campos de IMEI exibidos somente quando tipo = Celular -->
                <div id="bloco-imei" style="display:none;">
                    <div style="background:var(--background); border:1px solid var(--border); border-radius:2px; padding:var(--space-4); margin-bottom:var(--space-4);">
                        <div style="display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-3);">
                            <i data-lucide="smartphone" style="color:var(--lime);"></i>
                            <span style="font-size:0.8125rem; font-weight:700; font-family:var(--font-mono); text-transform:uppercase; color:var(--text-primary);">
                                Informações do Dispositivo Móvel
                            </span>
                        </div>
                        <div style="margin-bottom:var(--space-3);">
                            <label class="form-label" for="imei1">IMEI 1</label>
                            <input type="text" class="form-control" name="imei1" id="imei1" placeholder="Digite o IMEI principal">
                        </div>
                        <div>
                            <label class="form-label" for="imei2">IMEI 2 <span style="color:var(--text-muted); font-weight:400;">(Opcional)</span></label>
                            <input type="text" class="form-control" name="imei2" id="imei2" placeholder="Digite o IMEI secundário (se dual SIM)">
                        </div>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:var(--space-4); border-top:1px solid var(--border);">
                    <a href="/" class="btn btn-secondary btn-sm">Cancelar</a>
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i data-lucide="plus-circle"></i> Salvar Equipamento
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function verificarTipo() {
        let tipo = document.getElementById('tipo').value;
        let blocoImei = document.getElementById('bloco-imei');
        blocoImei.style.display = (tipo.toLowerCase() === 'celular') ? 'block' : 'none';
    }
</script>
{% endblock %}

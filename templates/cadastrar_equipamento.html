{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="/" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i> Painel
            </a>
            <span class="text-muted small">/</span>
            <span class="small fw-semibold" style="color: #373530;">Novo Equipamento</span>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-box-seam text-secondary"></i>
                    <span class="fw-semibold">Cadastrar Novo Equipamento</span>
                </div>
            </div>
            <div class="card-body p-4">
                <form action="/salvar-equipamento" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Tipo de Equipamento</label>
                        <select class="form-select" name="tipo" id="tipo" required onchange="verificarTipo()">
                            <option value="Camera">Câmera Fotográfica</option>
                            <option value="Celular">Celular / Smartphone</option>
                            <option value="Radio">Rádio Comunicador</option>
                            <option value="Tablet">Tablet Operacional</option>
                            <option value="Detector">Detector Multigás</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Modelo</label>
                        <input type="text" class="form-control" name="modelo"
                            placeholder="Ex: Samsung A54 / Nikon D3100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Número de Patrimônio / Serial (SN)</label>
                        <input type="text" class="form-control" name="patrimonio" placeholder="Ex: SN12345678" required>
                    </div>

                    <div id="bloco-imei" style="display: none;">
                        <div class="mb-3">
                            <label class="form-label">IMEI 1</label>
                            <input type="text" class="form-control" name="imei1" placeholder="Digite o IMEI 1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">IMEI 2</label>
                            <input type="text" class="form-control" name="imei2" placeholder="Digite o IMEI 2">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top" style="border-color: #e1e1df !important;">
                        <a href="/" class="btn btn-notion-secondary btn-sm">Cancelar</a>
                        <button type="submit" class="btn btn-notion-brand btn-sm px-4">Salvar Equipamento</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function verificarTipo() {
        let tipo = document.getElementById('tipo').value;
        let blocoImei = document.getElementById('bloco-imei');
        if (tipo.toLowerCase() === 'celular') {
            blocoImei.style.display = 'block';
        } else {
            blocoImei.style.display = 'none';
        }
    }
</script>
{% endblock %}

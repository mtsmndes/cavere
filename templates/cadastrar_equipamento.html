{% extends "base.html" %}
{% block content %}
<div style="max-width:520px; margin:0 auto;">

    <!-- Breadcrumb -->
    <div class="cv-breadcrumb">
        <a href="/"><i class="bi bi-grid-1x2 me-1"></i>Painel</a>
        <span class="sep">/</span>
        <span class="current">Cadastrar Equipamento</span>
    </div>

    <div class="card">
        <div class="card-header">
            <div style="display:flex; align-items:center; gap:var(--space-3);">
                <div style="width:32px;height:32px;border-radius:var(--radius-md);background:var(--status-info-bg);display:flex;align-items:center;justify-content:center;color:var(--status-info-text);">
                    <i class="bi bi-box-seam"></i>
                </div>
                <div>
                    <div style="font-size:0.9375rem; font-weight:600;">Cadastrar Novo Equipamento</div>
                    <div style="font-size:0.8125rem; color:var(--text-secondary);">Adicionar ativo ao inventario operacional</div>
                </div>
            </div>
        </div>

        <div class="card-body">
            <form action="/salvar-equipamento" method="POST" id="formEquipamento">

                <div style="margin-bottom:var(--space-4);">
                    <label class="form-label" for="tipo">Tipo de Equipamento <span style="color:var(--status-danger-text);">*</span></label>
                    <select class="form-select" name="tipo" id="tipo" required onchange="verificarTipo()">
                        <option value="Camera">📷 Camera Fotografica</option>
                        <option value="Celular">📱 Celular / Smartphone</option>
                        <option value="Radio">📻 Radio Comunicador</option>
                        <option value="Tablet">📟 Tablet Operacional</option>
                        <option value="Detector">🧪 Detector Multigas</option>
                    </select>
                </div>

                <div style="margin-bottom:var(--space-4);">
                    <label class="form-label" for="modelo">Modelo <span style="color:var(--status-danger-text);">*</span></label>
                    <input type="text" class="form-control" name="modelo" id="modelo"
                        placeholder="Ex: Samsung A54 / Nikon D3100" required>
                </div>

                <div style="margin-bottom:var(--space-4);">
                    <label class="form-label" for="patrimonio">Numero de Patrimonio / Serial (SN) <span style="color:var(--status-danger-text);">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                        <input type="text" class="form-control" name="patrimonio" id="patrimonio"
                            placeholder="Ex: SN12345678" required>
                    </div>
                </div>

                <!-- Campos de IMEI (somente para Celular) -->
                <div id="bloco-imei" style="display:none;">
                    <div style="background:var(--status-info-bg); border:1px solid var(--status-info-text); border-radius:var(--radius-md); padding:var(--space-4); margin-bottom:var(--space-4);">
                        <div style="display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-4);">
                            <i class="bi bi-phone" style="color:var(--status-info-text);"></i>
                            <span style="font-size:0.8125rem; font-weight:600; color:var(--status-info-text);">Informacoes do Dispositivo Movel</span>
                        </div>
                        <div style="margin-bottom:var(--space-4);">
                            <label class="form-label" for="imei1">IMEI 1</label>
                            <input type="text" class="form-control" name="imei1" id="imei1" placeholder="Digite o IMEI 1">
                        </div>
                        <div>
                            <label class="form-label" for="imei2">IMEI 2 <span style="color:var(--text-muted); font-weight:400;">(Opcional)</span></label>
                            <input type="text" class="form-control" name="imei2" id="imei2" placeholder="Digite o IMEI 2 (se dual SIM)">
                        </div>
                    </div>
                </div>

                <!-- Botoes -->
                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:var(--space-4); border-top:1px solid var(--border-subtle);">
                    <a href="/" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Salvar Equipamento
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function verificarTipo() {
        let tipo = document.getElementById('tipo').value;
        let blocoImei = document.getElementById('bloco-imei');
        blocoImei.style.display = (tipo.toLowerCase() === 'celular') ? 'block' : 'none';
    }
</script>
{% endblock %}

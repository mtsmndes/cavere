{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="/" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i> Painel
            </a>
            <span class="text-muted small">/</span>
            <span class="small fw-semibold" style="color: #373530;">Novo Usuário</span>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-gear text-secondary"></i>
                    <span class="fw-semibold">Cadastrar Novo Usuário</span>
                </div>
            </div>
            <div class="card-body p-4">
                <form action="/cadastrar-usuario" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome de Usuário (Login)</label>
                        <input type="text" class="form-control" name="username" placeholder="Ex: joao.silva" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha de Acesso</label>
                        <input type="password" class="form-control" name="senha" placeholder="Digite uma senha segura" required>
                        <div class="form-text text-muted" style="font-size: 0.74rem;">A senha é automaticamente criptografada com hash scrypt.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Perfil de Acesso (Papel)</label>
                        <select class="form-select" name="role" required>
                            <option value="coordenador" selected>Coordenador (Acesso a Meus Chamados & Solicitação)</option>
                            <option value="admin">Administrador (Acesso Geral ao Painel)</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top" style="border-color: #e1e1df !important;">
                        <a href="/" class="btn btn-notion-secondary btn-sm">Cancelar</a>
                        <button type="submit" class="btn btn-notion-brand btn-sm px-4">Salvar Usuário</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div style="max-width:560px; margin:0 auto;">

    <div class="cv-breadcrumb">
        <a href="/"><i data-lucide="layout-dashboard" class="me-1"></i>Painel Principal</a>
        <span class="sep">/</span>
        <span class="current">Novo Coordenador</span>
    </div>

    <div class="surface-card">
        <div class="surface-card-header">
            <div style="display:flex; align-items:center; gap:var(--space-3);">
                <div style="width:36px; height:36px; border-radius:2px; background:rgba(206, 220, 0, 0.08); border:1px solid rgba(206, 220, 0, 0.25); display:flex; align-items:center; justify-content:center; color:var(--lime);">
                    <i data-lucide="user-plus"></i>
                </div>
                <div>
                    <div style="font-size:1rem; font-weight:700; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.04em; color:var(--text-primary);">
                        Cadastrar Novo Coordenador
                    </div>
                    <div style="font-size:0.8125rem; color:var(--text-muted);">
                        Registro e vinculação de responsável operacional de campo
                    </div>
                </div>
            </div>
        </div>

        <div class="surface-card-body">
            <form action="/salvar-coordenador" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div style="margin-bottom:var(--space-4);">
                    <label class="form-label" for="campoNome">Nome Completo <span style="color:var(--status-danger-text);">*</span></label>
                    <input type="text" class="form-control" name="nome" id="campoNome" placeholder="Ex: Carlos Silva Mendes" required>
                </div>
                <div style="margin-bottom:var(--space-5);">
                    <label class="form-label" for="campoCpf">Matrícula Geral ou CPF <span style="color:var(--status-danger-text);">*</span></label>
                    <input type="text" class="form-control" name="cpf" id="campoCpf" inputmode="numeric" pattern="[0-9.-]*" oninput="this.value = this.value.replace(/[^0-9.-]/g, '')" placeholder="Ex: 104523 ou 123.456.789-00 (Apenas números)" required>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:var(--space-4); border-top:1px solid var(--border);">
                    <a href="/" class="btn btn-secondary btn-sm">Cancelar</a>
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i data-lucide="user-check"></i> Salvar Coordenador
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

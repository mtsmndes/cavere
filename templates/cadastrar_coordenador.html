{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="/" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i> Painel
            </a>
            <span class="text-muted small">/</span>
            <span class="small fw-semibold" style="color: #373530;">Novo Coordenador</span>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-plus text-secondary"></i>
                    <span class="fw-semibold">Cadastrar Novo Coordenador</span>
                </div>
            </div>
            <div class="card-body p-4">
                <form action="/salvar-coordenador" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" name="nome" placeholder="Ex: Carlos Silva" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CPF ou Matrícula</label>
                        <input type="text" class="form-control" name="cpf" placeholder="Ex: 123.456.789-00 ou M12345" required>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top" style="border-color: #e1e1df !important;">
                        <a href="/" class="btn btn-notion-secondary btn-sm">Cancelar</a>
                        <button type="submit" class="btn btn-notion-brand btn-sm px-4">Salvar Coordenador</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
